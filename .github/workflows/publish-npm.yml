name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify release tag and package version
        shell: bash
        run: |
          test -f package.json
          git_tag="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          echo "Git tag: ${GITHUB_REF_NAME}"
          package_name=$(node -p "require('./package.json').name")
          echo "Package: ${package_name}@${package_version}"
          test "$git_tag" = "$package_version" || {
            echo "Release tag and package.json version do not match." >&2
            exit 1
          }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build:frontend

      - name: Build npm runtime
        run: npm run build:npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Select npm dist-tag
        id: npm-tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.npm-tag.outputs.tag }}" --provenance
