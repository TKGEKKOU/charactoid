<section id="role-view" class="view is-hidden workbench-view role-workbench-page" data-workbench="role">
  <nav class="workspace-tabs" aria-label="角色工作台"><button class="workspace-tab is-active" type="button" data-workbench-tab="role-create">创建角色</button><button class="workspace-tab" type="button" data-workbench-tab="role-manage">角色设置</button></nav>
  <div class="workbench-panel is-active" data-workbench-panel="role-create">
    <div id="create-material-panel" class="tts-workflow role-create-flow">
      <ol id="create-steps" class="flow-steps create-flow-steps" aria-label="创建流程">
        <li data-step="upload" class="is-active">资料</li>
        <li data-step="analyze">分析</li>
        <li data-step="confirm">确认</li>
      </ol>
      <div id="draft-analyzing" class="create-stage draft-analyzing is-hidden" role="status" aria-live="polite">
        <p class="create-hero-kicker">正在阅读</p>
        <h2>整理资料，生成角色设定</h2>
        <p class="create-hero-copy">完成后会自动进入确认。</p>
        <div class="draft-analyzing-bar" aria-hidden="true"><span></span></div>
        <div class="create-actions create-actions-center">
          <button id="analyze-cancel" class="button button-ghost" type="button">取消</button>
        </div>
      </div>
      <form id="batch-form" class="create-stage upload-form">
        <header class="create-hero">
          <p class="create-hero-kicker">创建角色</p>
          <h2>从一份资料开始</h2>
          <p class="create-hero-copy">上传文档、图片，或粘贴文字。系统会据此生成名称与人设。</p>
          <span id="create-status" class="is-hidden">待开始</span>
        </header>
        <fieldset id="generation-mode" class="mode-switch create-mode-switch">
          <label><input type="radio" name="mode" value="character" checked><span>角色</span></label>
          <label><input type="radio" name="mode" value="expert"><span>检索助手</span></label>
        </fieldset>
        <div id="create-files-drop" class="upload-drop create-drop" tabindex="0" role="button" aria-label="选择文件">
          <i data-lucide="plus"></i>
          <b>拖入或选择资料</b>
          <span>文档、图片、文本，可一次多选</span>
          <output id="file-summary">尚未添加</output>
          <input id="document-files" type="file" multiple>
        </div>
        <details class="create-optional"><summary>粘贴文字</summary><label class="field text-supplement"><textarea id="direct-text" rows="4" placeholder="把想保留的设定或原文粘贴到这里"></textarea></label></details>
        <div class="module-actions create-actions">
          <p id="upload-error" class="inline-status" role="alert"></p>
          <button id="reset-batch" class="button button-ghost" type="button">清空</button>
          <button id="upload-button" class="button button-primary" type="submit">开始生成</button>
        </div>
      </form>
      <section id="draft-editor" class="create-stage draft-panel is-hidden">
        <header class="create-hero">
          <p class="create-hero-kicker">核对设定</p>
          <h2>确认后即可使用</h2>
          <p class="create-hero-copy">先看名称与人设是否贴近资料。若有候选人物，点选后会写入下方。</p>
          <span id="draft-status" class="is-hidden"></span>
        </header>
        <section id="candidate-picker" class="candidate-picker is-hidden">
          <b>候选人物</b>
          <p class="create-hint">仅列出资料里真正可扮演的人物。</p>
          <div id="candidate-list" class="candidate-list"></div>
        </section>
        <div class="draft-fields">
          <label class="field"><span>名称</span><input id="draft-name" maxlength="255" placeholder="角色名称"></label>
          <label class="field field-wide"><span>人设</span><textarea id="draft-profile" rows="9" placeholder="性格、经历、说话方式"></textarea></label>
          <div class="voice-select-row">
            <label class="field voice-select-field"><span>语音音色（可选）</span><select id="create-tts-asset"><option value="">稍后绑定</option></select></label>
            <label class="field voice-select-field"><span>默认语言</span><select id="create-tts-asset-lang"><option value="auto">自动</option><option value="zh">中文</option><option value="ja">日文</option><option value="en">英文</option></select></label>
          </div>
        </div>
        <section class="create-docs">
          <div class="section-heading"><b>已添加的资料</b></div>
          <div id="document-list" class="document-list create-document-list"></div>
        </section>
        <div class="module-actions create-actions">
          <p id="create-confirm-error" class="inline-status" role="alert"></p>
          <button id="create-back" class="button button-ghost" type="button">返回</button>
          <button id="create-cancel" class="button button-ghost" type="button">取消</button>
          <button id="save-draft" class="button button-ghost" type="button">保存草稿</button>
          <button id="confirm-draft" class="button button-primary" type="button">确认创建</button>
        </div>
      </section>
    </div>
  </div>
  <div class="workbench-panel" data-workbench-panel="role-manage"><div id="role-workbench-root" class="role-workbench-root"><div class="workbench-bootstrap">正在加载角色工作台...</div></div></div>
</section>
