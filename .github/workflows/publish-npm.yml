name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "确认发布当前 package.json 中的版本到 npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify manual release request
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM_RELEASE" = "true" || {
            echo "Publishing was not confirmed. Nothing was published." >&2
            exit 1
          }
          test -f package.json
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          echo "Package: ${package_name}@${package_version}"
          echo "Source ref: ${GITHUB_REF_NAME}"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on npm. Change package.json before publishing again." >&2
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build:frontend

      - name: Build npm runtime
        run: npm run build:npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Select npm dist-tag
        id: npm-tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.npm-tag.outputs.tag }}" --provenance
